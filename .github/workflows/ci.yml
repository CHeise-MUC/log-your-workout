name: CI

# When does this pipeline run?
# On every push to any branch, and on every Pull Request targeting main.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download the code from GitHub onto the CI server
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Install Node.js (the JavaScript runtime)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      # Step 3: Install all dependencies (reads package-lock.json exactly)
      - name: Install dependencies
        run: npm ci

      # Step 4: Build all apps (catches TypeScript errors)
      # The env block passes GitHub Secrets as environment variables.
      # Next.js needs these at build time to pre-render pages.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

      # Step 5: Unit Tests (service-layer tests, no real DB)
      - name: Test
        run: npm run test --workspace=apps/api

      # Step 6: Lint (checks code style and common mistakes)
      - name: Lint
        run: npm run lint
